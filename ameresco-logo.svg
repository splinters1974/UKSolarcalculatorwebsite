<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 175" width="560" height="175">
  <rect width="560" height="175" fill="#ffffff"/>

  <!-- ── AMERESCO wordmark ───────────────────────────────── -->
  <text
    x="10" y="108"
    font-family="'Arial Black','Franklin Gothic Heavy','Impact',Arial,sans-serif"
    font-weight="900"
    font-size="82"
    fill="#1B72BE"
    letter-spacing="2">AMERESCO</text>

  <!-- ── Tagline ─────────────────────────────────────────── -->
  <text
    x="12" y="142"
    font-family="Arial,'Helvetica Neue',Helvetica,sans-serif"
    font-weight="700"
    font-size="17"
    fill="#3AAA3C"
    letter-spacing="0.5">Green &#8226; Clean &#8226; Sustainable</text>

  <!-- ── Orbital mark ────────────────────────────────────── -->
  <!-- Two intersecting ellipse rings, green + blue, centred at (508,82) -->

  <!-- Green ring (tilted ~35° left of vertical) -->
  <ellipse
    cx="508" cy="82"
    rx="30" ry="58"
    fill="none"
    stroke="#3AAA3C"
    stroke-width="6"
    transform="rotate(-35 508 82)"/>

  <!-- Blue ring (tilted ~35° right of vertical) -->
  <ellipse
    cx="508" cy="82"
    rx="30" ry="58"
    fill="none"
    stroke="#1B72BE"
    stroke-width="6"
    transform="rotate(35 508 82)"/>

  <!-- ® symbol, top-right of orbital mark -->
  <text
    x="535" y="36"
    font-family="Arial,sans-serif"
    font-size="13"
    font-weight="400"
    fill="#1B72BE">&#174;</text>
</svg>
